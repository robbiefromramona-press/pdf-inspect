# Static site: Netlify serves the repo root. The build command minifies the
# browser JS in place, in Netlify's own checkout, on the way to publishing --
# your source files are never touched by it. ES module syntax, the export
# names and the `new URL("./engine-worker.js", import.meta.url)` worker
# reference all survive minification; verified by booting the minified build.
#
# IMPORTANT, and the reason this is only half a measure here: the actual
# product is engine/extract.py, which is NOT touched by this and cannot be.
# The browser has to fetch that file to run it in Pyodide, and the header
# block below still serves it as text/plain, so it opens as readable source
# in any browser tab. If the extraction engine is considered the asset worth
# protecting, minifying the JS does not address it -- see AUDIT-REPORT.md.
[build]
  publish = "."
  command = 'npx --yes esbuild@0.25.0 js/*.js scaffold/*.js --minify --allow-overwrite --outdir=. --entry-names="[dir]/[name]"'

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# The engine files change only when their filenames or the site deploy changes.
[[headers]]
  for = "/engine/*.whl"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/engine/*.py"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
